<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J'ai quelque chose pour toi...</title>
    <meta property="og:title" content="J'ai quelque chose pour toi...">
    <meta property="og:description" content="Clique pour voir !">
    <meta property="og:type" content="website">
    <meta name="description" content="Clique pour voir !">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a0a0a 0%, #0d0000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Dancing Script', cursive;
            color: #f4c2c2;
            overflow: hidden;
        }

        .loader {
            text-align: center;
        }

        .dots {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .text {
            font-size: 1.8rem;
            color: #ff6b8a;
            text-shadow: 0 0 20px rgba(255, 107, 138, 0.4);
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.3s;
        }

        .subtext {
            font-size: 1.1rem;
            color: #e8a0a0;
            margin-top: 1rem;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="dots">...</div>
        <p class="text">J'ai quelque chose pour toi</p>
        <p class="subtext">Patiente un instant...</p>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = 'surprise.html';
        }, 5000);
    </script>
</body>
</html>
